name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # 3.11 = what Posit Connect Cloud deploys with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Block resident/program data
        run: python scripts/check_no_data.py $(git ls-files)
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: python -m pytest -q

  # r/iteviz mirrors ite_core/nomogram.py; both suites check tests/fixtures/nomogram_parity.json.
  r-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/iteviz
          dependencies: '"hard"'   # roundsui (Suggests) is not on CRAN; colours fall back without it
          extra-packages: any::testthat, any::jsonlite, any::pkgload
      - name: R tests (parity + display)
        working-directory: r/iteviz
        run: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'
