name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # 3.11 = what Posit Connect Cloud deploys with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Block resident/program data
        run: python scripts/check_no_data.py $(git ls-files)
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: python -m pytest -q
